services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      # Каталог, настройки и фотографии переживают пересборку контейнера
      - ./data:/app/data
      - ./uploads:/app/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Нужен только для бесплатного домена DuckDNS с динамическим IP.
  # Запускается отдельно: docker compose --profile duckdns up -d
  # deploy.sh включает его сам, если в .env заполнен DUCKDNS_TOKEN.
  duckdns:
    image: alpine:3
    restart: unless-stopped
    profiles: ["duckdns"]
    env_file: .env
    command: >
      sh -c "apk add --no-cache curl >/dev/null 2>&1;
             while true; do
               curl -fsS \"https://www.duckdns.org/update?domains=$${DUCKDNS_SUBDOMAIN}&token=$${DUCKDNS_TOKEN}&ip=\" || echo 'DuckDNS: обновить IP не удалось';
               sleep 300;
             done"

volumes:
  caddy_data:
  caddy_config:
