<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Букет Ромашка — подробности и заказ"><title>Букет — Ромашка</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>
.product-page{background:#fcf8f5;min-height:calc(100vh - 118px);padding:38px 7vw 90px}.back{display:inline-flex;font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#897b74;margin-bottom:32px}.detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.75fr);gap:7vw;align-items:center;max-width:1200px;margin:auto}.detail-photo{aspect-ratio:1;overflow:hidden;border-radius:7px;background:#eee3dd;box-shadow:var(--shadow)}.detail-photo img{height:100%;object-fit:cover}.detail-copy .eyebrow{display:inline-block}.detail-copy h1{font-family:'Playfair Display';font-weight:500;font-size:clamp(45px,5vw,68px);line-height:1.02;letter-spacing:-.035em;margin:13px 0}.detail-price{font-size:21px;font-weight:700;margin:18px 0 22px}.detail-description{font-size:12px;color:var(--muted);line-height:1.9;max-width:520px}.detail-meta{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin:28px 0;background:#fff}.meta{padding:16px;border-right:1px solid var(--line)}.meta:last-child{border-right:0}.meta span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:#a08f87;margin-bottom:6px}.meta b{font-size:10px;font-weight:600}.detail-order{display:flex;gap:9px;flex-wrap:wrap}.detail-order .btn{min-width:190px}.availability{margin-top:17px;font-size:9px;color:#8b817b}.availability.ok{color:#4f9667}.availability.off{color:#a36b72}.product-header{height:86px;padding:0 5.5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fffdfb}.product-header .backtop{font-size:9px;color:#81746d}@media(max-width:800px){.detail{grid-template-columns:1fr}.product-page{padding:28px 22px 65px}.detail-copy h1{font-size:48px}.product-header{height:70px;padding:0 20px}.product-header .backtop{display:none}}
</style></head><body>
<header class="product-header"><a class="brand" href="/"><span class="brand-mark"><span>✿</span></span><span class="brand-copy"><b>Ромашка</b><small>цветочный магазин</small></span></a><a class="backtop" href="/">← Вернуться в каталог</a></header>
<main class="product-page"><a class="back" href="/">← Все букеты</a><div id="detail"><div class="loading">Открываем букет...</div></div></main>
<div class="floating-wa"><a id="floatingWhatsApp" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">◉</a></div>
<script>
const id=new URLSearchParams(location.search).get('id'),money=n=>Number(n||0).toLocaleString('ru-RU')+' сомони',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function init(){try{const [cr,pr]=await Promise.all([fetch('/api/config'),fetch('/api/products')]);const config=await cr.json(),products=await pr.json(),p=products.find(x=>String(x.id)===String(id));if(!p){document.querySelector('#detail').innerHTML='<div class="loading">Букет не найден.</div>';return}const wa='https://wa.me/'+config.whatsapp+'?text='+encodeURIComponent(`Здравствуйте! 🌸\nХочу заказать букет «${p.name}».\nЦена: ${money(p.price)}.\nПодскажите, пожалуйста, как оформить заказ?`);document.title=p.name+' — Ромашка';document.querySelector('#floatingWhatsApp').href='https://wa.me/'+config.whatsapp;document.querySelector('#detail').innerHTML=`<div class="detail"><div class="detail-photo"><img src="${p.image}" alt="${esc(p.name)}"></div><div class="detail-copy"><span class="eyebrow">${esc(p.category)}</span><h1>${esc(p.name)}</h1><div class="detail-price">${money(p.price)}</div><p class="detail-description">${esc(p.description)}</p><div class="detail-meta"><div class="meta"><span>Состав</span><b>${esc(p.composition||'Уточняйте при заказе')}</b></div><div class="meta"><span>Размер</span><b>${esc(p.size||'Индивидуально')}</b></div></div><div class="detail-order"><a class="btn btn-primary" href="${wa}" target="_blank" rel="noopener">Заказать в WhatsApp ↗</a><a class="btn btn-outline" href="/">Вернуться к выбору</a></div><div class="availability ${p.available?'ok':'off'}">${p.available?'● Букет доступен для заказа':'○ Сейчас нет в наличии'}</div></div></div>`}catch(e){document.querySelector('#detail').innerHTML='<div class="loading">Не удалось загрузить товар.</div>'}}init();
</script></body></html>
