<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><!--SEO--><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://images.unsplash.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css?v=__VERSION__"><style>
.product-page{background:#fcf8f5;min-height:calc(100vh - 118px);padding:38px 7vw 90px}.back{display:inline-flex;font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#897b74;margin-bottom:32px}.detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.75fr);gap:7vw;align-items:center;max-width:1200px;margin:auto}.detail-photo{aspect-ratio:1;overflow:hidden;border-radius:7px;background:#eee3dd;box-shadow:var(--shadow)}.detail-photo img{height:100%;object-fit:cover}.detail-copy .eyebrow{display:inline-block}.detail-copy h1{font-family:'Playfair Display';font-weight:500;font-size:clamp(45px,5vw,68px);line-height:1.02;letter-spacing:-.035em;margin:13px 0}.detail-price{font-size:21px;font-weight:700;margin:18px 0 22px}.detail-description{font-size:12px;color:var(--muted);line-height:1.9;max-width:520px}.detail-meta{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin:28px 0;background:#fff}.meta{padding:16px;border-right:1px solid var(--line)}.meta:last-child{border-right:0}.meta span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:#a08f87;margin-bottom:6px}.meta b{font-size:10px;font-weight:600}.detail-gallery{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}.detail-gallery img{width:68px;height:68px;object-fit:cover;border-radius:5px;cursor:pointer;border:1px solid var(--line);opacity:.6;transition:.15s;background:#eee3dd}.detail-gallery img:hover{opacity:.9}.detail-gallery img.on{opacity:1;border-color:var(--rose)}.detail-price s{font-size:14px;font-weight:400;color:#b3a49d;margin-right:9px}.detail-order{display:flex;gap:9px;flex-wrap:wrap}.detail-order .btn{min-width:190px}.availability{margin-top:17px;font-size:9px;color:#8b817b}.availability.ok{color:#4f9667}.availability.off{color:#a36b72}.product-header{height:86px;padding:0 5.5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fffdfb}.product-header .backtop{font-size:9px;color:#81746d}@media(max-width:800px){.detail{grid-template-columns:1fr}.product-page{padding:28px 22px 65px}.detail-copy h1{font-size:48px}.product-header{height:70px;padding:0 20px}.product-header .backtop{display:none}}
</style></head><body>
<header class="product-header"><a class="brand" href="/"><span class="brand-mark"><span>✿</span></span><span class="brand-copy"><b>Ромашка</b><small>цветочный магазин</small></span></a><a class="backtop" href="/">← Вернуться в каталог</a></header>
<main class="product-page"><a class="back" href="/">← Все букеты</a><div id="detail"><div class="loading">Открываем букет...</div></div></main>
<div class="floating-wa"><a id="floatingWhatsApp" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">◉</a></div>
<script>
/* Адрес теперь /bukety/17-nezhnaya-romashka, но старый ?id=17 тоже должен
   открываться: по нему уже разошлись ссылки в переписках. */
const id=(location.pathname.match(/^\/bukety\/(\d+)/)||[])[1]||new URLSearchParams(location.search).get('id');
let settings={currency:'сомони',whatsapp:'992901403263',shopName:'Ромашка'},gallery=[];
const money=n=>Number(n||0).toLocaleString('ru-RU')+' '+(settings.currency||'сомони');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const PLACEHOLDER='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="600" height="600" fill="#f3ebe6"/><text x="300" y="330" font-size="110" text-anchor="middle" fill="#cdb8b0">&#10047;</text></svg>');
function imgFallback(el){el.onerror=null;el.src=PLACEHOLDER}
/* Переключение фото в мини-галерее под главным снимком. */
function selectPhoto(index){const main=document.querySelector('#mainPhoto');if(!main||!gallery[index])return;main.src=gallery[index];document.querySelectorAll('.detail-gallery img').forEach((el,i)=>el.classList.toggle('on',i===index))}
function metaCell(label,value){return value?`<div class="meta"><span>${esc(label)}</span><b>${esc(value)}</b></div>`:''}
async function init(){
 try{
  const response=await fetch('/api/bootstrap');
  if(!response.ok)throw new Error('bootstrap failed');
  const data=await response.json();
  settings=Object.assign(settings,data.settings||{});
  const p=(data.products||[]).find(x=>String(x.id)===String(id));

  if(settings.shopName)document.querySelectorAll('.brand-copy b').forEach(el=>el.textContent=settings.shopName);
  if(settings.tagline)document.querySelectorAll('.brand-copy small').forEach(el=>el.textContent=settings.tagline);
  document.querySelector('#floatingWhatsApp').href='https://wa.me/'+settings.whatsapp;

  if(!p){document.querySelector('#detail').innerHTML='<div class="loading">Букет не найден. <a href="/">Вернуться в каталог</a></div>';return}

  gallery=(p.images&&p.images.length?p.images:[p.image]).filter(Boolean);
  if(!gallery.length)gallery=[PLACEHOLDER];


  const thumbs=gallery.length>1?`<div class="detail-gallery">${gallery.map((src,i)=>`<img src="${esc(src)}" alt="${esc(p.name)} — фото ${i+1}" class="${i===0?'on':''}" loading="lazy" onerror="imgFallback(this)" onclick="selectPhoto(${i})">`).join('')}</div>`:'';

  document.querySelector('#detail').innerHTML=`<div class="detail"><div><div class="detail-photo"><img id="mainPhoto" src="${esc(gallery[0])}" alt="${esc(p.name)}" onerror="imgFallback(this)"></div>${thumbs}</div><div class="detail-copy"><span class="eyebrow">${esc(p.category)}</span><h1>${esc(p.name)}</h1><div class="detail-price">${p.oldPrice>p.price?`<s>${money(p.oldPrice)}</s>`:''}${money(p.price)}</div><p class="detail-description">${esc(p.description)}</p><div class="detail-meta">${metaCell('Состав',p.composition||'Уточняйте при заказе')}${metaCell('Размер',p.size||'Индивидуально')}${metaCell('Повод',(p.occasions||[]).join(', '))}${metaCell('Цвет',(p.colors||[]).join(', '))}</div><div class="detail-order">${p.available?'<button class="btn btn-primary" onclick="orderNow()">Заказать букет →</button>':''}<a class="btn btn-outline" href="/">Вернуться к выбору</a></div><div class="availability ${p.available?'ok':'off'}">${p.available?'● Букет доступен для заказа':'○ Сейчас нет в наличии'}</div></div></div>`;
 }catch(e){
  document.querySelector('#detail').innerHTML='<div class="loading">Не удалось загрузить товар. Проверьте, что сервер запущен.</div>';
 }
}
init();

/* Раньше кнопка вела прямо в WhatsApp, и заказ уходил без адреса и мимо заявок.
   Теперь букет кладётся в общую корзину (она одна на весь сайт, в localStorage),
   а оформление с адресом открывается на главной. */
function orderNow(){
  try{
    const cart=JSON.parse(localStorage.getItem('romashka_cart')||'[]');
    const item=cart.find(x=>String(x.id)===String(id));
    if(item)item.qty++;else cart.push({id:Number(id),qty:1});
    localStorage.setItem('romashka_cart',JSON.stringify(cart));
  }catch(e){/* приватный режим — оформим без запоминания */}
  location.href='/?checkout=1';
}
</script></body></html>
